<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Terrific Loads | Furniture &amp; Appliance Delivery in Cape Town</title>
    <meta
      name="description"
      content="Bought furniture, appliances or bulky items that won't fit in your car? Terrific Loads offers same-day and next-day retail collection and delivery. Request a quote today."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Terrific Loads" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:title" content="Terrific Loads | Furniture, Appliance &amp; Bulky Item Delivery" />
